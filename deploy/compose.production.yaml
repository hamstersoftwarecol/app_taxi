services:
  caddy:
    image: caddy:2-alpine
    profiles: [production]
    restart: unless-stopped
    environment:
      DOMAIN: ${DOMAIN:?Define DOMAIN antes de activar HTTPS público}
      ACME_EMAIL: ${ACME_EMAIL:?Define ACME_EMAIL}
    ports: ["80:80", "443:443", "443:443/udp"]
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on: [gateway, admin]
    networks: [backend]
volumes:
  caddy_data:
  caddy_config:
